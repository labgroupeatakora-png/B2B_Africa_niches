
name: Compiler APK AFRICA NICHES

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilation Android
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer les outils Android
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true

      - name: Installer les paquets Android
        shell: bash
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verifier le projet Android
        shell: bash
        run: |
          echo "Racine du depot :"
          ls -la
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERREUR : fichier settings.gradle introuvable a la racine"
            exit 1
          fi
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERREUR : fichier Gradle de l'application introuvable"
            exit 1
          fi

      - name: Compiler APK debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AFRICA-NICHES-Business-APK-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
